<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Primera Comunión Regina Y Ricardo 🕊️</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Nuestra Primera Comunión Regina Y Ricardo 🕊️">
    <meta property="og:description" content="Te invitamos a celebrar con nosotros este día tan especial.">
    <meta property="og:image" content="https://raw.githubusercontent.com/regina1503/Primera-Comuni-n-Aranza-Ricardo/main/miniatura.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">
    <meta property="og:image:alt" content="Invitación Primera Comunión">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Nuestra Primera Comunión Regina Y Ricardo 🕊️">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/regina1503/Primera-Comuni-n-Aranza-Ricardo/main/miniatura.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Georgia', serif;
            background-color: #f4f4f6;
        }

        /* Container for smooth snap sliding or stacked navigation */
        .invitation-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .page {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Background Image setup with raw image URLs from GitHub repository */
        #page1 {
            background-image: url('https://raw.githubusercontent.com/regina1503/Primera-Comuni-n-Aranza-Ricardo/main/PPC.jpg');
        }

        #page2 {
            background-image: url('https://raw.githubusercontent.com/regina1503/Primera-Comuni-n-Aranza-Ricardo/main/Agrega%20(1).jpg');
        }

        #page3 {
            background-image: url('https://raw.githubusercontent.com/regina1503/Primera-Comuni-n-Aranza-Ricardo/main/Agrega%20(3).jpg');
        }

        /* Pulse animation for interactive buttons */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn-pulse {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

        /* Location buttons */
        .btn-location {
            background: #977846;
            border: 2px solid #977846;
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .btn-location:hover {
            background: #977846;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(151, 120, 70, 0.4);
        }

        .btn-location i {
            color: #ffffff;
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="invitation-container" id="scrollContainer">
        
        <!-- Página 1 -->
        <section id="page1" class="page">
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex flex-col items-center animate-bounce text-yellow-700 opacity-75">
                <span class="text-xs uppercase tracking-widest font-sans mb-1">Desliza hacia abajo</span>
                <i class="fa-solid fa-chevron-down text-lg"></i>
            </div>
        </section>

        <!-- Página 2 -->
        <section id="page2" class="page">
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex flex-col items-center animate-bounce text-yellow-700 opacity-75">
                <i class="fa-solid fa-chevron-down text-lg"></i>
            </div>
        </section>

        <!-- Página 3 -->
        <section id="page3" class="page">
            
            <!-- Botón de ubicación (Subido 10% adicional desde la parte inferior) -->
            <div class="absolute bottom-[27%] left-1/2 transform -translate-x-1/2 w-11/12 max-w-[12.28rem] text-center z-10">
                <a href="https://www.google.com/maps/place/Convenciones+y+Catering+Cantabria/@19.6753884,-101.2048473,17z/data=!3m1!4b1!4m6!3m5!1s0x842d0dce84c55a8b:0xfef3693d6440c3e8!8m2!3d19.6753884!4d-101.2022724!16s%2Fg%2F11c6rj88l4!18m1!1e1?entry=ttu&amp;g_ep=EgoyMDI2MTAxOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" 
                   class="btn-location inline-flex items-center justify-center gap-[0.64rem] w-full py-[0.75rem] px-[1.275rem] rounded-full font-sans font-semibold text-[0.744rem] tracking-wider uppercase">
                    <i class="fa-solid fa-map-pin text-[0.956rem]"></i>
                    <span>Ver Ubicación</span>
                </a>
            </div>

            <!-- Mensaje final -->
            <div class="absolute bottom-[4%] left-1/2 transform -translate-x-1/2 w-11/12 max-w-xs z-10 text-center">
                <p class="text-4xl italic" style="font-family: Georgia, serif; color: #977846;">¡No Faltes!</p>
            </div>

        </section>

    </div>

    <script>
        const container = document.getElementById('scrollContainer');
    </script>
</body>
</html>
